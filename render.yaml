services:
  - type: web
    name: newsprk-backend
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npx prisma generate
    startCommand: node src/app.js
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
